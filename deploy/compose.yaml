services:
  viorka-server:
    image: ${VIORKA_IMAGE:-ghcr.io/vioira/viorka:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    user: "0:0"
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      VIORKA_LISTEN: 0.0.0.0:8080
      VIORKA_DATABASE: /app/data/viorka.db
      VIORKA_WEB_DIR: /app/web/dist
      VIORKA_TRUSTED_PROXIES: ${VIORKA_TRUSTED_PROXIES:-}
      VIORKA_ORIGIN: ${VIORKA_ORIGIN:?请设置公开 HTTPS Origin，例如 https://panel.example.com}
      VIORKA_TLS_CERT: /app/tls/fullchain.pem
      VIORKA_TLS_KEY: /app/tls/privkey.pem
    ports:
      - '${VIORKA_BIND_IP:-127.0.0.1}:${VIORKA_PORT:-8443}:8080'
    volumes:
      - viorka-data:/app/data
      - type: bind
        source: ${VIORKA_TLS_DIR:?请设置包含 fullchain.pem 和 privkey.pem 的证书目录}
        target: /app/tls
        read_only: true
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: ${VIORKA_BRIDGE_SUBNET:-172.30.240.0/24}
          gateway: ${VIORKA_BRIDGE_GATEWAY:-172.30.240.1}

volumes:
  viorka-data:
