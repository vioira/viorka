name: viorka-ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -type f))"
      - name: Test
        run: go test ./...
      - name: Protocol example test
        run: python3 scripts/check_protocol.py
      - name: Build server
        run: CGO_ENABLED=0 go build -o /tmp/viorka-server ./cmd/server
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps (scaffold; lockfile not shipped)
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
