name: viorka-ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -type f))"
      - name: Test
        run: |
          python3 scripts/release.py --check-version
          python3 scripts/test_release.py
          go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Install schema validators
        run: python3 -m pip install -r scripts/requirements-dev.txt
      - name: Protocol example test
        run: |
          python3 scripts/check_protocol.py
          go run ./cmd/openapi -check
          python3 scripts/check_openapi.py
          python3 scripts/generate_protocol.py --check
      - name: Build server
        run: CGO_ENABLED=0 go build -o /tmp/viorka-server ./cmd/server
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        run: |
          pnpm run typecheck
          pnpm run build
          pnpm exec biome check src/features src/App.tsx src/main.tsx src/console.css src/react-dom.d.ts
