name: viorka-release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - name: Install validation and Web dependencies
        run: |
          python3 -m pip install -r scripts/requirements-dev.txt
          pnpm --dir web install --frozen-lockfile
      - name: Verify tag and versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py --check-version --tag "$RELEASE_TAG"
      - name: Validate
        run: |
          sh scripts/validate.sh
          sh scripts/check_release_web.sh
          pnpm --dir web run build
      - name: Build release assets
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            asset="viorka-server-linux-$arch"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -o "dist/$asset" ./cmd/server
          done
          tar -czf dist/viorka-web.tar.gz -C web/dist .
          cd dist
          sha256sum viorka-server-linux-* viorka-web.tar.gz > SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --generate-notes "${flags[@]}"
