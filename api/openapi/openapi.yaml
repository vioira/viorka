info:
  description: Generated from Go route registrations and transport types. All roles are installation-wide. JSON requests reject unknown fields and are limited to 16384 bytes unless the operation declares a different limit. String length limits described in bytes are enforced by the application. Credentials must not be placed in URLs except the independent subscription bearer token in the download path; never put secrets in query strings or logs.
  title: Viorka M0 API
  version: 0.2.0
openapi: 3.1.0
paths:
  /api/v1/agents/challenge:
    post:
      description: Creates a one-minute challenge bound to the node and Panel origin.
      operationId: agentChallenge
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Request Entity Too Large
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unsupported Media Type
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Too Many Requests
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Service Unavailable
      summary: Create Agent challenge
  /api/v1/agents/enroll:
    post:
      description: Binds the existing node identified by the token to an Ed25519 identity without creating another node. Same token and public key may retry before expiry; a different key cannot reuse it.
      operationId: enrollAgent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollResponse"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Request Entity Too Large
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unsupported Media Type
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Too Many Requests
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Service Unavailable
      summary: Enroll Agent
  /api/v1/agents/metrics:
    post:
      description: "Telemetry v3: maximum 1048576-byte uncompressed application/json body, no query, Origin or Cookie. Requires bearer authentication and completed v3 negotiation; management WSS may be offline. Receipt acknowledges in-memory metric admission; daily_traffic_acks additionally confirm committed daily records when node.traffic.daily.v1 is negotiated. 401 distinguishes session_expired from permanent session_invalid/identity_revoked/node_disabled. 409 means unsupported_protocol or stale_session. 429 rate_limited and 503 overloaded include Retry-After seconds. Rejections with a decoded batch ID return TelemetryReceipt; other failures return the standard error object. Strict validation follows api/agent/v1/envelope.schema.json TelemetryBatch, including cross-field rules."
      operationId: agentMetrics
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryBatch"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryReceipt"
          description: OK
        "400":
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/TelemetryReceipt"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Forbidden
        "409":
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/TelemetryReceipt"
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Request Entity Too Large
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unsupported Media Type
        "429":
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/TelemetryReceipt"
          description: Too Many Requests
          headers:
            Retry-After:
              description: Minimum retry delay in seconds for rate_limited/overloaded
              schema:
                type: string
        "503":
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/TelemetryReceipt"
          description: Service Unavailable
          headers:
            Retry-After:
              description: Minimum retry delay in seconds for rate_limited/overloaded
              schema:
                type: string
      security:
        - agentBearer: []
  /api/v1/agents/register:
    post:
      description: "Accepts single-node and batch registration tokens. Single-node tokens bind the existing node, preserve its name and support managed engine recovery. Batch tokens create an offline node and independent identity atomically; engine recovery is rejected. Same token/key retries are idempotent while valid, even at batch quota. Batch name: explicit name or prefix + hostname, generated fallback if absent. Request body limit: 3 MiB."
      operationId: registerAgent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollResponse"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Conflict
        "413":
          content:
            application/json:
