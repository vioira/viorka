          description: Unauthorized
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Request Entity Too Large
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unsupported Media Type
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Too Many Requests
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Service Unavailable
      summary: Create Agent session
  /api/v1/agents/ws:
    get:
      description: WebSocket upgrade authenticated with an Agent bearer token. Browser Origin and all query parameters are rejected. Agent message schemas are maintained separately under api/agent/v1; this document describes only the HTTP handshake.
      operationId: agentWebSocket
      responses:
        "101":
          description: Switching Protocols
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Forbidden
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Service Unavailable
      security:
        - agentBearer: []
      summary: Connect Agent WebSocket
  /api/v1/audit-logs:
    get:
      description: "Minimum role: admin. Newest first by created_at and ID descending. Use next_cursor as after; empty means no next page. System records have no actor_id. Unknown cursors return 400. Does not expose summary_json."
      operationId: listAuditLogs
      parameters:
        - in: query
          name: limit
          schema:
            default: 50
            maximum: 100
            minimum: 1
            type: integer
        - in: query
          name: after
          schema:
            maxLength: 128
            type: string
        - in: query
          name: kind
          schema:
            default: all
            enum:
              - all
              - user
              - system
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogsResponse"
          description: OK
        "400":
          content:
