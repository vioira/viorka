  /api/v1/events:
    get:
      description: "Minimum role: viewer. SSE sends an initial notification snapshot {items}, then ready. Durable changes trigger notifications {items, removed_ids} or change {kind, node_id?, node?}. Kinds: node (current node metadata and authorized installed engine name/version summaries), nodes (membership invalidation), tasks (task_id when one task changes), engines (engine_id and authorized summary when one engine changes), history, telemetry_settings (desired revision), telemetry_settings_result, settings. Subscribe before loading REST snapshots; ready on reconnect/overflow requires resynchronization. No Last-Event-ID replay; latest 100 notifications retained. Agent heartbeats only persist last_seen_at and do not emit node changes. State and engine changes remain immediate. Comment heartbeats every 15 seconds only revalidate access/settings, never poll business data. closed ends disabled or invalid-session streams. Each write has a five-second deadline; streams and pending changes are bounded."
      operationId: events
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Forbidden
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Conflict
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Too Many Requests
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Service Unavailable
      security:
        - cookieAuth: []
      summary: Subscribe to server events
  /api/v1/metrics/events:
    get:
      description: "Minimum role: viewer. SSE metrics events contain MetricFrame: reset, items keyed by node ID, removed_ids. For through scope each item is a compact monitoring Summary (received_at, expires_at, nullable cpu and memory percentages, daily_traffic, traffic_billing_mode and traffic_expires_at); for node scope each item is a LiveSnapshot with latest metrics, sequence, reset and points. Per-node sequences order accepted samples. For view=live, initial/reset frames establish the cursor without replaying raw cached samples. metric_trends supplies independent server-owned windows for CPU, memory, network, connections, load, disk, disk_io and processes, each at most 120 points over ten minutes. Each chart carries reset, period_seconds, statistic, points (id, at, source, values, optional partial), and removed_ids. Initial/reset windows contain closed history buckets (30 seconds for fast charts, 180 seconds for full charts); later frames contain only additions and removals. Raw telemetry points are empty for view=live. Other views retain their existing projection. Subsequent raw frames contain only samples after the cursor. Timestamps identify actual sample times. Overflow forces a fresh snapshot. closed ends a disabled/expired stream. No Last-Event-ID replay. Cookie viewer authorization is installation-wide, matching node REST access. Authorized node membership owns shared telemetry v3 viewer references. The last viewer starts a 15-second grace; active demand is renewed every 30 seconds with a 90-second Agent lease. References and initial snapshots do not mean the Agent has acknowledged realtime mode. A negotiated v3 item exposes telemetry (independent fast/full/public_ip groups, decimal-string integer counters, sampled/received timestamps, stale flags, applied settings and raw fast points) and telemetry_control (http/pending/realtime/degraded, viewer references, lease remainder). management_online is independent of metrics freshness: offline management does not invalidate fresh POST data. Samples use the nested telemetry window; outer history/points are empty. Duplicate uploads refresh only overall receipt time, not group times or points. REST history and the general events stream do not acquire this demand."
      operationId: metricEvents
      parameters:
        - description: "Only with node: overview (CPU, memory, filesystem), live (all groups and every new point), history (all current groups without points), settings (applied settings and billing traffic). Initial/reset frames replace state; subsequent frames omit unchanged fast/full/public_ip/settings groups, which clients retain. Non-sliding merge windows are two seconds for live and five seconds for other views. Omitting view preserves the full legacy stream."
          in: query
          name: view
          schema:
            enum:
              - overview
              - live
              - history
              - settings
            type: string
        - description: One node ID for complete metrics and up to 600 points from the last ten minutes. Exactly one of node/through is required.
          in: query
          name: node
          schema:
            type: string
        - description: Inclusive ascending node ID range from the start of the list, at most 1024 nodes. Sends MetricSummaryFrame with received_at, expires_at, nullable cpu and memory percentages, daily_traffic decimal-string counters, traffic_billing_mode and traffic_expires_at. Initial snapshot is immediate; subsequent changes are coalesced over non-sliding five-second windows. Timestamps use UTC.
          in: query
          name: through
          schema:
            type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
